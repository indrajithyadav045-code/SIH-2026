version: '3.8'

services:
  voiceguard-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceguard-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./voiceguard.db
      - RAW_AUDIO_RETENTION=false
      - FEATURE_LOGGING=true
      - MODEL_PATH=/app/checkpoints
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3